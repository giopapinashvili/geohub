name: Checks

on:
  push:
    branches: [master, geohub-fixes]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  checks:
    name: Lint, translations and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Translation keys
        run: npm run i18n:check
      - name: Production build
        run: npm run build
      - name: Committed dist matches the build
        run: git diff --stat --exit-code -- dist || (echo "dist/ is out of date — run npm run build and commit it" && exit 1)

  rules:
    name: Security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Allowed and refused reads/writes against firestore.rules
        run: npm run test:rules

  e2e:
    name: End-to-end flows (emulators, production rules)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Feature flows, page sweep and calls (three test accounts)
        run: npm run test:e2e:ci
