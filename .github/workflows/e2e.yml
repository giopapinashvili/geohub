name: Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    name: Lint, translations and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Translation keys
        run: npm run i18n:check
      - name: Production build
        run: npm run build
      - name: Committed dist matches the build
        run: git diff --stat --exit-code -- dist || (echo "dist/ is out of date — run npm run build and commit it" && exit 1)
