body{background:var(--ds-bg);color:var(--ds-text);min-height:100vh;overflow-x:hidden}.clean-page{padding-top:90px;min-height:100vh;background:radial-gradient(circle at top left,var(--ds-h-video-wash),transparent 35%),var(--ds-bg-deep)}.clean-hero{max-width:1180px;margin:0 auto;padding:70px 24px 42px}.clean-badge{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border:1px solid var(--ds-h-video-wash);border-radius:999px;color:var(--ds-h-video-ink);background:var(--ds-h-video-wash);font-weight:800;text-transform:uppercase;font-size:.72rem;letter-spacing:.04em}.clean-title{font-size:clamp(2.4rem,5vw,4.8rem);line-height:1.05;margin:22px 0 16px;font-weight:950;max-width:760px}.clean-title span{background:linear-gradient(135deg,var(--ds-h-video),var(--ds-h-group));-webkit-background-clip:text;color:transparent}.clean-desc{max-width:640px;color:var(--ds-text-2);font-size:1.05rem;line-height:1.7}.clean-search{margin-top:30px;display:flex;gap:12px;max-width:620px;background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:18px;padding:10px}.clean-search input{flex:1;background:transparent;border:0;color:#fff;outline:0;padding:8px 10px;font-size:1rem}.clean-search button{border:0;border-radius:14px;padding:12px 20px;background:linear-gradient(135deg,var(--ds-h-video),var(--ds-h-group));color:white;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}.clean-stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:14px;max-width:740px;margin-top:28px}.clean-stat{padding:18px;border:1px solid var(--ds-line);border-radius:18px;background:var(--ds-surface-2)}.clean-stat strong{display:block;font-size:1.7rem}.clean-stat span{color:var(--ds-text-3);font-size:.78rem}.clean-content{max-width:1180px;margin:0 auto;padding:34px 24px 90px;display:grid;grid-template-columns:280px 1fr;gap:24px}.clean-card{border:1px solid var(--ds-line);border-radius:20px;background:var(--ds-surface);padding:22px}.clean-empty{min-height:260px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ds-text-3);border:1px dashed var(--ds-line-strong);border-radius:22px;background:var(--ds-surface-2)}.clean-empty i{font-size:2rem;color:var(--ds-h-video);margin-bottom:12px}.clean-empty h3{color:var(--ds-text);margin:0 0 8px}@media(max-width:900px){.clean-page{padding-top:72px}.clean-hero{padding:42px 18px 28px}.clean-content{grid-template-columns:1fr;padding:22px 18px 120px}.clean-stats{grid-template-columns:repeat(2,1fr)}}
/* Product grid */
.pd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;width:100%}
.pd-card{background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:18px;overflow:hidden;transition:all .2s;display:flex;flex-direction:column}
.pd-card:hover{border-color:var(--ds-h-video-wash);transform:translateY(-2px);background:var(--ds-line-soft)}
.pd-card-img{width:100%;height:160px;overflow:hidden;flex-shrink:0}.pd-card-img img{width:100%;height:100%;object-fit:cover}
.pd-card-body{padding:15px;display:flex;flex-direction:column;flex:1}
.pd-card-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.pd-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.66rem;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.pd-badge-featured{background:var(--ds-h-reward-wash);color:var(--ds-h-reward-ink)}.pd-badge-featured i{font-size:.6rem}
.pd-badge-cat{background:var(--ds-h-group-wash);color:var(--ds-h-group-ink)}
.pd-badge-price{background:var(--ds-h-video-wash);color:var(--ds-h-video-ink)}
.pd-card-title{font-size:.93rem;font-weight:800;color:var(--ds-text);margin-bottom:5px}
.pd-card-biz,.pd-card-city{font-size:.75rem;color:var(--ds-text-3);display:flex;align-items:center;gap:5px;margin-bottom:3px}
.pd-card-biz i,.pd-card-city i{color:var(--ds-h-video);font-size:.7rem}
.pd-card-desc{font-size:.8rem;color:var(--ds-text-3);line-height:1.5;margin:7px 0 11px;flex:1}
.pd-card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.pd-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:9px;font-size:.75rem;font-weight:700;text-decoration:none;transition:all .15s;flex-shrink:0;cursor:pointer}
.pd-btn-ghost{background:var(--ds-line-soft);border:1px solid var(--ds-line-strong);color:var(--ds-text-3)}.pd-btn-ghost:hover{background:var(--ds-line-strong);color:var(--ds-text)}
.pd-btn-primary{background:linear-gradient(135deg,var(--ds-h-video),var(--ds-h-group));color:#fff;border:none}.pd-btn-primary:hover{opacity:.9}
/* Sidebar filters */
.pd-filter-btn{background:var(--ds-surface);border:1px solid var(--ds-line);color:var(--ds-text-3);padding:5px 11px;border-radius:8px;font-size:.73rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.pd-filter-btn.active{background:var(--ds-h-video-wash);border-color:var(--ds-h-video-wash);color:var(--ds-h-video-ink)}
.pd-filter-btn:hover:not(.active){background:var(--ds-line);color:var(--ds-text)}
.pd-city-select{width:100%;background:var(--ds-line-soft);border:1px solid var(--ds-line-strong);color:var(--ds-text);padding:8px 12px;border-radius:10px;font-size:.83rem;outline:none;margin-top:6px}
.pd-city-select option{background:var(--ds-surface-2)}
.pd-filter-label{font-size:.72rem;color:var(--ds-text-3);display:block;margin:10px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
</style>
